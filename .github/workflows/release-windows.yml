name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
        default: "v0.1.0"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  weights:
    name: Pack weights and publish the Windows release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download the public checkpoints and split them
        run: |
          uv python install 3.13
          uv venv "$RUNNER_TEMP/weight-venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/weight-venv/bin/activate"
          uv pip install huggingface_hub
          python scripts/release_weights.py download --cache "$RUNNER_TEMP/hf"
          python scripts/release_weights.py pack --cache "$RUNNER_TEMP/hf" --out release-weights

      - name: Create the GitHub release and upload the weight parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          NOTES=$(cat <<EOF
          Windows release of Magenta RealTime 2.

          The checkpoint is not one file. GitHub limits a release asset to 2 GB, and model.safetensors is about 9 GB. magenta-weights.json lists the parts. install.ps1, npx, and bunx reassemble them into the Hugging Face cache.

          The weight bytes are the public files from magenta-community/magenta-realtime-2 and magenta-torch/magenta-rt-musiccoca-torch. They stay under those model licenses.

          Install on Windows:

          powershell -ExecutionPolicy Bypass -File .\install.ps1

          Or, from a checkout:

          npx --package github:stepupgaming/magenta-windows magenta --help
          bunx --package github:stepupgaming/magenta-windows magenta --help
          bun run dev
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-weights/* install.ps1 --clobber
          else
            gh release create "$TAG" release-weights/* install.ps1 \
              --target "${GITHUB_SHA}" \
              --title "$TAG" \
              --notes "$NOTES"
          fi
