name: Release Windows

# release.yml dispatches this for each tag Release Please creates. It does not
# also listen for tag pushes, so a release never builds twice.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.2"
        required: true
        type: string
      pack_weights:
        description: "Download and upload the checkpoint parts"
        required: false
        type: boolean
        default: true
      build_exe:
        description: "Build and upload Magenta.exe"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  weights:
    name: Pack weights and publish the Windows release
    if: ${{ inputs.pack_weights }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download the public checkpoints and split them
        run: |
          uv python install 3.13
          uv venv "$RUNNER_TEMP/weight-venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/weight-venv/bin/activate"
          uv pip install huggingface_hub
          python scripts/release_weights.py download --cache "$RUNNER_TEMP/hf"
          python scripts/release_weights.py pack --cache "$RUNNER_TEMP/hf" --out release-weights

      - name: Create the GitHub release and upload the weight parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-weights/* --clobber
          else
            gh release create "$TAG" release-weights/* \
              --target "${GITHUB_SHA}" \
              --title "$TAG" \
              --notes "Download Magenta.exe and run it."
          fi

  app:
    name: Build Magenta.exe
    if: ${{ inputs.build_exe }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/native/src-tauri -> target"

      - name: Build the exe
        run: pnpm --filter native exec tauri build --no-bundle

      - name: Upload Magenta.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:TAG
          $exe = "apps\native\src-tauri\target\release\Magenta.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem "apps\native\src-tauri\target\release" -Filter *.exe | Select-Object -ExpandProperty Name
            throw "Magenta.exe was not produced"
          }
          $ready = $false
          foreach ($try in 1..60) {
            gh release view $tag --repo ${{ github.repository }} *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 20
          }
          if (-not $ready) {
            gh release create $tag --repo ${{ github.repository }} --target "${{ github.sha }}" --title $tag --notes "Download Magenta.exe and run it."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag $exe --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release delete-asset $tag install.ps1 --repo ${{ github.repository }} -y
          exit 0

  notes:
    name: Write the release notes
    needs: [weights, app]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put the download, the changelog, and the weights credit on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_notes.py write "$TAG" --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
