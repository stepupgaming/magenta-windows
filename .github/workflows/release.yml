name: Release
description: Release Please

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set correct latest release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} --limit 10 --json tagName -q ".[].tagName" | grep -E '^v[0-9]' | head -n 1)
          if [ -n "$LATEST_TAG" ]; then
            gh release edit "$LATEST_TAG" --repo ${{ github.repository }} --latest
          fi

      # A tag made with the workflow token starts no workflows, but a dispatch
      # does, so start the Windows build for the new tag here.
      - name: Build the Windows release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run release-windows.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
            -f tag="$TAG" -f pack_weights=true -f build_exe=true
