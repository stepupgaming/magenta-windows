[project]
name = "magenta-win"
version = "0.1.0"
description = "Windows CUDA server for Magenta RealTime 2"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.12.0+cu130",
    "transformers==5.12.1",
    "numpy==2.3.5",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
    "soundfile==0.13.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=17.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
